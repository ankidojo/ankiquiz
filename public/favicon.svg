<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="#5B21B6"/>

  <!-- Inner lighter circle -->
  <circle cx="128" cy="128" r="115" fill="#7C3AED"/>

  <!-- Card/Quiz book shape -->
  <rect x="60" y="60" width="136" height="136" rx="12" fill="white" opacity="0.95"/>

  <!-- Left page accent -->
  <rect x="60" y="60" width="68" height="136" rx="12" fill="#A78BFA" opacity="0.3"/>

  <!-- Question mark symbol -->
  <text x="128" y="155" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#5B21B6" text-anchor="middle">?</text>

  <!-- Checkmark accent (top right) -->
  <g transform="translate(170, 85)">
    <circle cx="0" cy="0" r="16" fill="#10B981" opacity="0.9"/>
    <path d="M -8 0 L -2 6 L 8 -4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="80" cy="75" r="3" fill="#EC4899" opacity="0.7"/>
  <circle cx="176" cy="175" r="3" fill="#F59E0B" opacity="0.7"/>
</svg>